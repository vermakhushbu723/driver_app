name: driver_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  geolocator: ^14.1.2
  go_router: ^17.5.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: ic_launcher
  ios: true
  image_path_ios: assets/icon/icon_ios.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 21
  web:
    generate: false
    image_path: assets/icon/icon.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/splash.png
  android_12:
    color: "#FFFFFF"
    image: assets/icon/splash_android12.png
  android: true
  ios: true
  web: false
